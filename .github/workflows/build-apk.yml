name: Build PowerWatch Rescue APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PowerWatchRescue*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack source ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname 'PowerWatchRescue*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Nu am gasit ZIP-ul PowerWatchRescue"
            exit 1
          fi
          echo "Folosesc: $ZIP"
          rm -rf PowerWatchRescue-audited
          unzip -q "$ZIP"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: PowerWatchRescue-audited
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp PowerWatchRescue-audited/app/build/outputs/apk/debug/app-debug.apk PowerWatchRescue-debug.apk
          sha256sum PowerWatchRescue-debug.apk > PowerWatchRescue-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerWatchRescue-debug
          path: |
            PowerWatchRescue-debug.apk
            PowerWatchRescue-debug.apk.sha256

      - name: Put APK in repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PowerWatchRescue-debug.apk PowerWatchRescue-debug.apk.sha256
          git diff --cached --quiet || git commit -m "Build PowerWatch Rescue APK"
          git push

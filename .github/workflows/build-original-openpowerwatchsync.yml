name: Build original OpenPowerWatchSync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-original-openpowerwatchsync.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$SDKROOT" > OpenPowerWatchSync/local.properties

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build original source unchanged
        working-directory: OpenPowerWatchSync
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp OpenPowerWatchSync/app/build/outputs/apk/debug/app-debug.apk OpenPowerWatchSync-original-debug.apk
          sha256sum OpenPowerWatchSync-original-debug.apk > OpenPowerWatchSync-original-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenPowerWatchSync-original-debug
          path: |
            OpenPowerWatchSync-original-debug.apk
            OpenPowerWatchSync-original-debug.apk.sha256

      - name: Publish APK to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f OpenPowerWatchSync-original-debug.apk OpenPowerWatchSync-original-debug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Build original OpenPowerWatchSync APK"
            git push
          fi
